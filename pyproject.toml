[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-uplift"
version = "1.0.0"
description = "Uplift modelling and budgeted targeting on the 14M-row Criteo uplift trial"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "econml>=0.15",
    "dowhy>=0.11",
    "optuna>=3.5",
    "mlflow-skinny>=2.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools]
packages = ["causal_uplift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["B905"]
per-file-ignores = { "scripts/*" = ["E402"] }

[tool.ruff.lint.isort]
known-first-party = ["causal_uplift"]
